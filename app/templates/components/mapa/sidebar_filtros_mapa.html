<aside id="sidebar-filtros" class="w-full xl:w-64 shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 transition-all duration-300 ease-in-out overflow-hidden flex flex-col">
    
    <div id="btn-toggle-sidebar" class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 hover:bg-slate-100 cursor-pointer transition-colors group">
        <div class="flex items-center gap-3 overflow-hidden">
            <svg class="w-5 h-5 text-blue-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            <h3 id="sidebar-title" class="text-xs font-bold text-slate-600 uppercase tracking-wider whitespace-nowrap transition-opacity duration-300 opacity-100">Filtros</h3>
        </div>
        <button id="btn-toggle-icon" class="text-slate-400 group-hover:text-blue-600 transition-transform duration-300 transform rotate-0 opacity-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>
    
    <div id="sidebar-content" class="transition-opacity duration-300 opacity-100">
        <form id="form-filtros-mapa" 
              hx-get="/dashboard/{{ operadora.codigo_registro_operadora }}/mapa/conteudo" 
              hx-target="#conteudo-mapa" 
              hx-trigger="change"
              class="p-5 flex flex-col gap-6 xl:min-w-[15.5rem]">
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">1. Filtrar por Estado</label>
                <select name="estado" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 shadow-sm outline-none cursor-pointer">
                    <option value="TODOS">Brasil Inteiro</option>
                    {% for uf in estados %}
                        <option value="{{ uf }}" {% if uf == estado_selecionado %}selected{% endif %}>{{ uf }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>
</aside>
