<!-- SIDEBAR DE FILTROS -->
<aside id="sidebar-filtros" class="w-full xl:w-72 shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 transition-all duration-300 ease-in-out overflow-hidden flex flex-col">
    
    <!-- HEADER DO PAINEL (ID adicionado para o JS capturar o clique) -->
    <div id="btn-toggle-sidebar" class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 hover:bg-slate-100 cursor-pointer transition-colors group" title="Recolher/Expandir Filtros">
        
        <div class="flex items-center gap-3 overflow-hidden">
            <svg class="w-5 h-5 text-blue-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            <h3 id="sidebar-title" class="text-xs font-bold text-slate-600 uppercase tracking-wider whitespace-nowrap transition-opacity duration-300 opacity-100">Painel de Filtros</h3>
        </div>
        
        <button id="btn-toggle-icon" class="text-slate-400 group-hover:text-blue-600 transition-transform duration-300 transform rotate-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>
    
    <!-- CONTEÚDO (Formulário) -->
    <div id="sidebar-content" class="transition-opacity duration-300 opacity-100">
        <!-- O min-w-[17.5rem] impede o texto de espremer enquanto a barra desliza -->
        <form id="form-filtros-regiao" 
              hx-get="/dashboard/{{ operadora.codigo_registro_operadora }}/regiao/conteudo" 
              hx-target="#conteudo-regiao" 
              hx-trigger="change"
              class="p-5 flex flex-col gap-6 xl:min-w-[17.5rem]">
            
            <!-- Filtro: Município -->
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">1. Município em Análise</label>
                <select name="municipio" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 shadow-sm outline-none cursor-pointer">
                    <option value="">Principal Município (Padrão)</option>
                    {% for m in municipios %}
                        <option value="{{ m.codigo_municipio }}">{{ m.nome_municipio }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Filtro: Modalidade -->
            <div class="flex flex-col">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">2. Modalidades Concorrentes</label>
                <div class="max-h-[350px] overflow-y-auto pr-2 flex flex-col gap-3">
                    {% for mod in modalidades %}
                        <label class="flex items-start gap-3 cursor-pointer group/item">
                            <input type="checkbox" name="modalidade" value="{{ mod }}" class="mt-0.5 w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer shadow-sm">
                            <span class="text-xs font-medium text-slate-600 group-hover/item:text-blue-600 leading-snug transition-colors">{{ mod }}</span>
                        </label>
                    {% endfor %}
                </div>
                <p class="text-[10px] text-slate-400 mt-4 pt-3 border-t border-slate-100 italic">
                    * Deixe vazio para analisar todo o mercado local.
                </p>
            </div>
        </form>
    </div>
</aside>
